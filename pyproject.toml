[project]
name = "predictions"
version = "0.1.0"
description = "AI-powered market predictions and global news analysis using multi-agent simulation"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "flask>=3.0.0",
    "flask-cors>=6.0.0",
    "gunicorn>=22.0.0",
    "openai>=1.0.0",
    "pydantic-settings>=2.0.0",
    "atoma>=0.0.17",
    "requests>=2.31.0",
    "pyyaml>=6.0.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.4.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
