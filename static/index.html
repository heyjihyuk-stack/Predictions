<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Predictions - Market & Global Affairs</title>
  <link rel="stylesheet" href="/static/css/style.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
</head>
<body>

<header class="app-header">
  <h1><span>Predictions</span> | Market & Global Affairs</h1>
  <nav class="nav-tabs">
    <button class="nav-tab active" data-tab="markets">Markets</button>
    <button class="nav-tab" data-tab="forex">Forex</button>
    <button class="nav-tab" data-tab="news">News Impact</button>
    <button class="nav-tab" data-tab="predictions">Predictions</button>
  </nav>
</header>

<main class="container">
  <!-- Prediction Change Alerts -->
  <div id="change-alerts"></div>

  <!-- Markets Tab -->
  <section id="tab-markets" class="tab-content">
    <div class="section-label">Global Stock Indices</div>
    <div id="indices-grid" class="market-grid">
      <div class="loading"><div class="spinner"></div> Loading market data...</div>
    </div>
    <!-- Detail view (hidden by default) -->
    <div id="index-detail" class="card" style="display:none;">
      <div class="card-header">
        <h2 id="index-detail-name"></h2>
        <div class="period-selector" id="index-period-selector">
          <button class="period-btn" data-period="1w">1W</button>
          <button class="period-btn active" data-period="1m">1M</button>
          <button class="period-btn" data-period="3m">3M</button>
          <button class="period-btn" data-period="1y">1Y</button>
          <button class="period-btn" data-period="5y">5Y</button>
        </div>
      </div>
      <div class="chart-container"><canvas id="index-chart"></canvas></div>
      <div class="predictions-grid" id="index-predictions"></div>
    </div>
  </section>

  <!-- Forex Tab -->
  <section id="tab-forex" class="tab-content" style="display:none;">
    <div class="section-label">Major Forex Pairs</div>
    <div id="forex-grid" class="market-grid">
      <div class="loading"><div class="spinner"></div> Loading forex data...</div>
    </div>
    <div id="forex-detail" class="card" style="display:none;">
      <div class="card-header">
        <h2 id="forex-detail-name"></h2>
        <div class="period-selector" id="forex-period-selector">
          <button class="period-btn" data-period="1w">1W</button>
          <button class="period-btn active" data-period="1m">1M</button>
          <button class="period-btn" data-period="3m">3M</button>
          <button class="period-btn" data-period="1y">1Y</button>
          <button class="period-btn" data-period="5y">5Y</button>
        </div>
      </div>
      <div class="chart-container"><canvas id="forex-chart"></canvas></div>
      <div class="predictions-grid" id="forex-predictions"></div>
    </div>
  </section>

  <!-- News Impact Tab -->
  <section id="tab-news" class="tab-content" style="display:none;">
    <div class="card">
      <div class="card-header">
        <h2>News Impact Index</h2>
        <button class="period-btn active" onclick="loadNewsImpact()" style="background:var(--accent);color:#fff;padding:8px 16px;border-radius:6px;">Refresh</button>
      </div>
      <ul class="news-list" id="news-list">
        <div class="loading"><div class="spinner"></div> Analyzing news impact...</div>
      </ul>
    </div>
  </section>

  <!-- Predictions Tab -->
  <section id="tab-predictions" class="tab-content" style="display:none;">
    <div class="section-label">All Market Predictions</div>
    <div id="all-predictions">
      <div class="loading"><div class="spinner"></div> Loading predictions...</div>
    </div>
  </section>
</main>

<!-- News Detail Modal -->
<div class="modal-overlay" id="news-modal">
  <div class="modal" style="position:relative;">
    <button class="close-btn" onclick="closeModal()">&times;</button>
    <div id="modal-content"></div>
  </div>
</div>

<script src="/static/js/app.js"></script>
</body>
</html>
